<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Una pagina HTML statica moderna e responsive." />
    <title>Cool Website</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f4f7fb;
        --surface: #ffffff;
        --text: #172033;
        --muted: #64748b;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --border: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 28rem),
          var(--background);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1120px, calc(100% - 40px));
        margin-inline: auto;
      }

      .site-header {
        height: 76px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(12px);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .nav-links {
        display: flex;
        gap: 28px;
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 600;
      }

      .nav-links a:hover {
        color: var(--primary);
      }

      main {
        display: grid;
        min-height: calc(100vh - 76px);
        place-items: center;
        padding: 64px 0;
      }

      .hero {
        max-width: 760px;
        text-align: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 14px;
        background: var(--surface);
        color: var(--primary);
        font-size: 0.82rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 24px 0 18px;
        font-size: clamp(3rem, 8vw, 5.75rem);
        line-height: 0.98;
        letter-spacing: -0.065em;
      }

      .hero p {
        max-width: 620px;
        margin: 0 auto;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.7;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 34px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 0 20px;
        font-weight: 750;
        transition: 160ms ease;
      }

      .button-primary {
        background: var(--primary);
        color: white;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.22);
      }

      .button-primary:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
      }

      .button-secondary {
        border-color: var(--border);
        background: var(--surface);
      }

      .button-secondary:hover {
        border-color: #cbd5e1;
        transform: translateY(-2px);
      }

      @media (max-width: 600px) {
        .container {
          width: min(100% - 32px, 1120px);
        }

        .nav-links {
          display: none;
        }

        main {
          min-height: calc(100vh - 76px);
          padding: 48px 0;
        }

        h1 {
          font-size: clamp(3rem, 15vw, 4.25rem);
        }

        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="container nav" aria-label="Navigazione principale">
        <a class="brand" href="#" aria-label="Home">Cool Website</a>
        <div class="nav-links">
          <a href="#servizi">Servizi</a>
          <a href="#chi-siamo">Chi siamo</a>
          <a href="#contatti">Contatti</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="container hero" aria-labelledby="hero-title">
        <span class="eyebrow">Nuovo progetto</span>
        <h1 id="hero-title">La tua idea, online.</h1>
        <p>
          Una base leggera, moderna e responsive per iniziare subito a costruire
          la tua prossima pagina web.
        </p>
        <div class="actions">
          <a class="button button-primary" href="#inizia">Inizia ora</a>
          <a class="button button-secondary" href="#scopri">Scopri di più</a>
        </div>
      </section>
    </main>
  </body>
</html>
